<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口算练习 · 100 以内加减法</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef4ff 0%, #fdf6ee 100%);
    color: #22304a;
    min-height: 100vh;
  }
  .card {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px 28px;
    box-shadow: 0 8px 30px rgba(40, 60, 110, .10);
  }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
  .sub { margin: 0 0 20px; font-size: 14px; color: #6b7893; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    margin-bottom: 8px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: #f6f8fd;
    font-size: 21px;
  }
  .no { width: 30px; flex: none; font-size: 13px; color: #9aa6bd; }
  .expr { flex: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=number] {
    width: 78px;
    flex: none;
    padding: 6px 8px;
    font-size: 20px;
    text-align: center;
    border: 2px solid #cfd9ee;
    border-radius: 10px;
    outline: none;
    background: #fff;
  }
  input[type=number]:focus { border-color: #4d7cff; }
  input:disabled { background: #f0f2f7; color: #5a6785; }
  .row.ok { border-color: #2faf7a; background: #f0fbf6; }
  .row.bad { border-color: #e8736b; background: #fff3f2; }
  .tip { flex: none; font-size: 13px; color: #d0524a; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: #4d7cff;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button.ghost { background: #eaf0ff; color: #3459b8; }
  button:active { opacity: .85; }
  .result {
    margin-top: 18px;
    padding: 14px;
    text-align: center;
    font-size: 18px;
    background: #f6f8fd;
    border-radius: 12px;
  }
  .result strong { font-size: 30px; color: #2faf7a; }
</style>
</head>
<body>
<div class="card">
  <h1>口算练习</h1>
  <p class="sub">100 以内加减法 · 每题 10 分 · 共 10 题</p>
  <div id="list"></div>
  <button id="submit">提交批改</button>
  <div class="result" id="result" hidden></div>
  <button class="ghost" id="again">再来一组</button>
</div>

<script id="core">
function makeQuestion(rand) {
  const r = typeof rand === 'function' ? rand : Math.random;
  const op = r() < 0.5 ? '+' : '-';
  let a = Math.floor(r() * 101);
  let b = op === '+' ? Math.floor(r() * (101 - a)) : Math.floor(r() * (a + 1));
  return { a: a, b: b, op: op, ans: op === '+' ? a + b : a - b };
}

function makeSet(n, rand) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(makeQuestion(rand));
  return out;
}

function grade(questions, answers) {
  let correct = 0;
  const details = questions.map(function (q, i) {
    const raw = answers[i] == null ? '' : String(answers[i]).trim();
    const ok = raw !== '' && Number(raw) === q.ans;
    if (ok) correct++;
    return { ok: ok, expected: q.ans, given: raw };
  });
  return { correct: correct, wrong: questions.length - correct, details: details };
}
</script>

<script>
var questions = [];
var listEl = document.getElementById('list');
var resultEl = document.getElementById('result');

function render() {
  questions = makeSet(10, Math.random);
  resultEl.hidden = true;
  listEl.innerHTML = '';
  questions.forEach(function (q, i) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="no">' + (i + 1) + '.</span>' +
      '<span class="expr">' + q.a + ' ' + q.op + ' ' + q.b + ' = </span>' +
      '<input type="number" inputmode="numeric" aria-label="第' + (i + 1) + '题答案">';
    listEl.appendChild(row);
  });
}

function submit() {
  var inputs = Array.prototype.slice.call(listEl.querySelectorAll('input'));
  var r = grade(questions, inputs.map(function (x) { return x.value; }));
  r.details.forEach(function (d, i) {
    var row = listEl.children[i];
    row.classList.add(d.ok ? 'ok' : 'bad');
    inputs[i].disabled = true;
    if (!d.ok) {
      var tip = document.createElement('span');
      tip.className = 'tip';
      tip.textContent = '正确 ' + d.expected;
      row.appendChild(tip);
    }
  });
  resultEl.hidden = false;
  resultEl.innerHTML = '答对 <strong>' + r.correct + '</strong> / ' + questions.length +
    ' 题 · 得分 ' + (r.correct * 10);
}

document.getElementById('submit').addEventListener('click', submit);
document.getElementById('again').addEventListener('click', render);
render();
</script>
</body>
</html>
